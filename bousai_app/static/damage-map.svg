  <rect x="24" y="345" width="190" height="58" rx="7" fill="#fff" opacity=".94"/>
  <circle cx="49" cy="365" r="7" fill="#d85445"/><text x="66" y="371" font-family="sans-serif" font-size="15" fill="#394b52">Resident report</text>
