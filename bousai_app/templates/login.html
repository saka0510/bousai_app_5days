{% extends "base.html" %}

{% block title %}管理者ログイン{% endblock %}

{% block content %}
<style>
  .login-page { align-items: center; display: grid; min-height: calc(100vh - 68px); padding: 32px 16px; }
  .login-panel { background: #fff; border: 1px solid #d8e1ed; border-radius: 6px; box-shadow: 0 8px 28px rgba(29, 67, 111, .12); margin: 0 auto; max-width: 420px; padding: 28px; width: 100%; }
  .login-panel h1 { color: #204c91; font-size: 23px; margin: 0 0 8px; text-align: center; }
  .login-lead { color: #5d6e7d; font-size: 14px; line-height: 1.6; margin: 0 0 22px; text-align: center; }
  .login-error { background: #fff0ee; border: 1px solid #e9b9b4; border-radius: 4px; color: #912b25; font-size: 14px; margin: 0 0 15px; padding: 10px 12px; }
  .login-field { display: grid; gap: 7px; margin-bottom: 18px; }
  .login-field label { color: #40586b; font-size: 13px; font-weight: 700; }
  .login-field input { border: 1px solid #b8c8d6; border-radius: 4px; font: inherit; min-height: 44px; padding: 9px 11px; width: 100%; }
  .login-field input:focus-visible, .login-submit:focus-visible { outline: 3px solid #e3a928; outline-offset: 2px; }
  .login-submit { background: #2458a6; border: 1px solid #2458a6; border-radius: 4px; color: #fff; cursor: pointer; font: inherit; font-weight: 700; min-height: 44px; width: 100%; }
  .login-submit:hover { background: #1b4789; }
  @media (max-width: 480px) { .login-page { padding: 20px 14px; }.login-panel { padding: 22px 18px; }.login-panel h1 { font-size: 21px; } }
</style>
<div class="login-page">
  <section class="login-panel" aria-labelledby="loginTitle">
    <h1 id="loginTitle">管理者ログイン</h1>
    <p class="login-lead">災害対応一覧・指示ボード・避難所登録の利用には管理者権限が必要です。</p>

    {% if error %}<p class="login-error" role="alert">{{ message }}</p>{% endif %}

    <form method="post">
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <div class="login-field">
        <label for="password">パスワード（「123」と入力してください）</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="login-submit" type="submit">ログイン</button>
    </form>
  </section>
</div>

{% endblock %}
